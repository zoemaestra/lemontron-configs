#####################################################################
#   Additional Sensors
#####################################################################

[temperature_sensor mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

#####################################################################
#   Bed Adjustment Routines
#####################################################################

[bed_screws]
 ## To be used with BED_SCREWS_ADJUST
[bed_screws]
screw1: 90,20
screw1_name: rear
screw2: 5,170
screw2_name: left
screw3: 180,170
screw3_name: right

[screws_tilt_adjust]
screw1: 75, 20
screw1_name: rear
screw2: 5, 123
screw2_name: left
screw3: 175, 123
screw3_name: right
horizontal_move_z: 3
speed: 150
screw_thread: CCW-M3

#[screws_tilt_adjust]
#screw1: 85, 20
#screw1_name: rear
#screw2: 5, 123
#screw2_name: left
#screw3: 162, 123
#screw3_name: right
#horizontal_move_z: 3
#speed: 150
#screw_thread: CCW-M3

#####################################################################
#   Buzzer
#####################################################################

# [output_pin _buzzer]
# pin: gpio22
# value: 0
# shutdown_value: 0

#####################################################################
#   Additional Features
#####################################################################

#[input_shaper]
[exclude_object]
[idle_timeout]
timeout: 1800

# [probe]
# z_offset = 2.020

#####################################################################
#   Additional Files
#####################################################################

[include positron_macros.cfg]
[pa_test]
size_x: 100   # X dimension tower size  (mm)
size_y: 50    # Y dimension tower size  (mm)
height: 50    # Height of tower (mm)
origin_x: 90 # Center of the bed in X
origin_y: 90 # Center of the bed in Y
layer_height: 0.2 # mm
first_layer_height: 0.24 # mm
perimeters: 2 # Number of perimeters to be printed for the tower
brim_width: 6 # Width of brim (mm)
slow_velocity:   20 # Slowest velocity for PA test segment (mm/s)
medium_velocity: 50 # Medium velocity for PA test segment (mm/s)
fast_velocity:  150 # End velocity for PA test segment (mm/s)
filament_diameter: 1.75
fan_speed: 1.0 # Fan speed applied after the brim is printed

